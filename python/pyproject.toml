[project]
name = "craftilot"
version = "0.2.1"
description = "Python client to drive a Minecraft player through the McBot mod (Fabric)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=5.1.0.95",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcbot"]
